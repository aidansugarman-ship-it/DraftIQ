name: Build iOS Device IPA (AltStore)

# Produces an unsigned .ipa you sideload onto an iPhone via AltStore.
# AltServer re-signs it with your free Apple ID at install time.
#
# Trigger manually from the Actions tab, or push to main.

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-device-ipa:
    name: Build DraftIQ .ipa for iPhone
    runs-on: macos-14

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install npm dependencies
        run: npm install

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-device-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-device-

      - name: Generate iOS project from Expo config
        run: npx expo prebuild --clean -p ios

      - name: Install CocoaPods dependencies
        run: cd ios && pod install

      - name: Build iOS app for Device (unsigned, AltStore will re-sign)
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY:               ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN:           ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID:            ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET:        ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:   ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID:                ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID:           ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_YAHOO_CLIENT_ID:                ${{ secrets.EXPO_PUBLIC_YAHOO_CLIENT_ID }}
          EXPO_PUBLIC_SENTRY_DSN:                     ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
        run: |
          cd ios
          # Release config bundles the JS into the .app. Unsigned arm64
          # device build — AltStore signs it with the user's Apple ID
          # at install time on the iPhone.
          xcodebuild build \
            -workspace DraftIQ.xcworkspace \
            -scheme DraftIQ \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Package as IPA
        run: |
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          # A Release .app with no main.jsbundle builds fine but crashes at
          # launch with "No bundle URL present" — fail loudly instead.
          if [ -n "$APP_PATH" ] && [ ! -f "$APP_PATH/main.jsbundle" ]; then
            echo "::error::main.jsbundle missing from $APP_PATH — the app would crash on launch."
            exit 1
          fi
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found in Release-iphoneos"; exit 1
          fi
          echo "Found app: $APP_PATH"

          # IPA = ZIP with a Payload/ folder containing the .app
          mkdir -p artifact
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          # `-y` preserves symlinks (required for frameworks)
          zip -qry artifact/DraftIQ.ipa Payload
          rm -rf Payload
          ls -lh artifact/

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: DraftIQ-iPhone-IPA
          path: artifact/DraftIQ.ipa
          retention-days: 14
